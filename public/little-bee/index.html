          <strong data-i18n="brandName">小蜜蜂</strong>
          <button class="toolbar-button sidebar-toggle" id="sidebarToggle" type="button" aria-label="收起侧边栏" aria-controls="appSidebar" aria-expanded="true"><svg class="ui-icon" aria-hidden="true"><use href="#icon-sidebar"></use></svg></button>
        </div>
        <button class="new-chat" id="newChat" type="button">
          <svg class="ui-icon" aria-hidden="true"><use href="#icon-new-chat"></use></svg><span class="label" data-i18n="newChat">新建对话</span>
        </button>

        <section class="history-section">
          <div class="section-label" data-i18n="history">对话回溯</div>
          <div id="historyList" class="history-list"></div>
        </section>

        <div class="sidebar-footer">
          <div class="language-picker">
            <button class="language-switcher" id="languageToggle" type="button" aria-label="切换语言" title="切换语言" aria-haspopup="menu" aria-controls="languageMenu" aria-expanded="false">
              <svg class="ui-icon" aria-hidden="true"><use href="#icon-globe"></use></svg><span class="language-current" data-i18n="languageCurrent">简体中文</span>
            </button>
            <div class="language-menu" id="languageMenu" role="menu" aria-label="切换语言" hidden>
              <button type="button" role="menuitemradio" data-help-language="en" aria-checked="false" lang="en" tabindex="-1"><span>English</span><span class="language-check" aria-hidden="true"><svg class="ui-icon" aria-hidden="true"><use href="#icon-check"></use></svg></span></button>
              <button type="button" role="menuitemradio" data-help-language="fr" aria-checked="false" lang="fr" tabindex="-1"><span>Français</span><span class="language-check" aria-hidden="true"><svg class="ui-icon" aria-hidden="true"><use href="#icon-check"></use></svg></span></button>
              <button type="button" role="menuitemradio" data-help-language="ar" aria-checked="false" lang="ar" tabindex="-1"><span dir="rtl">العربية</span><span class="language-check" aria-hidden="true"><svg class="ui-icon" aria-hidden="true"><use href="#icon-check"></use></svg></span></button>

            </div>
          </div>

        </div>
      </aside>
      <button class="sidebar-scrim" id="sidebarScrim" type="button" aria-label="关闭侧边栏" hidden></button>

      <main class="chat-panel">
        <header class="chat-toolbar">
          <div class="collapsed-tools">
            <button class="toolbar-button" id="sidebarExpand" type="button" aria-label="展开侧边栏" aria-controls="appSidebar" aria-expanded="false"><svg class="ui-icon" aria-hidden="true"><use href="#icon-sidebar"></use></svg></button>
            <button class="toolbar-button" id="compactNewChat" type="button" aria-label="新建对话"><svg class="ui-icon" aria-hidden="true"><use href="#icon-new-chat"></use></svg></button>
          </div>
          <div class="role-picker">
            <label id="roleLabel" for="roleSelect">我是：</label>
            <span class="role-select-wrap">
              <button class="role-trigger" id="roleTrigger" type="button" aria-haspopup="listbox" aria-controls="roleMenu" aria-expanded="false"><span id="currentRoleName">教师</span><svg class="ui-icon" aria-hidden="true"><use href="#icon-chevron"></use></svg></button>
              <select id="roleSelect" data-i18n-aria-label="selectRole" aria-label="选择问答角色" tabindex="-1" aria-hidden="true">
              <option value="teacher">教师</option><option value="student">学生</option><option value="admin">管理员</option><option value="supervisor">督导员</option>
            </select>
              <span class="role-menu" id="roleMenu" role="listbox" data-i18n-aria-label="selectRole" aria-label="选择问答角色" hidden>
                <button type="button" role="option" data-help-role="teacher" aria-selected="true">教师</button>
                <button type="button" role="option" data-help-role="student" aria-selected="false">学生</button>
                <button type="button" role="option" data-help-role="admin" aria-selected="false">管理员</button>
                <button type="button" role="option" data-help-role="supervisor" aria-selected="false">督导员</button>
              </span>
            </span>
            <small id="roleHint">角色选择控制帮助与管理入口，不代表登录认证</small>
            <small id="roleHintMobile" class="role-hint-mobile" dir="auto">角色选择入口，不代表登录认证</small>
          </div>
          <button class="toolbar-button help-toggle" id="helpToggle" type="button" aria-label="打开常见问题" data-i18n-aria-label="openCommonQuestions" aria-controls="promptPanelContent" aria-expanded="false"><svg class="ui-icon" aria-hidden="true"><use href="#icon-assistant"></use></svg></button>
        </header>
        <div class="welcome-heading prompt-heading">
          <span class="prompt-bee bee-mascot" aria-hidden="true"></span>
          <div><h1 data-i18n="welcomeTitle">老师您好，我是小蜜蜂</h1><p data-i18n="welcomeSubtitle">先选择需要帮助的系统，再点击一个常见问题开始。</p>
              <p class="language-content-note" id="languageContentNote" hidden></p></div>
        </div>
        <section class="prompt-strip" aria-label="推荐问题" data-i18n-aria-label="recommendedQuestions">
          <button class="prompt-collapsed-icon" type="button" aria-label="打开常见问题" data-i18n-aria-label="openCommonQuestions" aria-controls="promptPanelContent" aria-expanded="false"><svg class="ui-icon" aria-hidden="true"><use href="#icon-assistant"></use></svg></button>
          <div class="prompt-panel-content" id="promptPanelContent">
            <button class="prompt-panel-close" type="button" aria-label="收起常见问题" data-i18n-aria-label="closeCommonQuestions">×</button>
            <div class="prompt-grid prompt-grid-products">
              <div class="prompt-loading" data-i18n="loadingHelp">正在加载帮助文档…</div>
            </div>
          </div>
        </section>

        <section class="messages" id="messages" aria-live="polite"></section>

        <form class="composer" id="chatForm" autocomplete="off">
          <button class="icon-button" id="knowledgeButton" type="button" title="打开常见问题" aria-label="打开常见问题" data-i18n-title="openCommonQuestions" data-i18n-aria-label="openCommonQuestions" aria-controls="promptPanelContent" aria-expanded="false">
            <svg class="ui-icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
          </button>
          <textarea id="chatInput" autocomplete="off" dir="auto" rows="2" aria-label="输入问题" data-i18n-aria-label="inputQuestion" placeholder="请输入你的问题，例如：如何发布作业？" data-i18n-placeholder="inputPlaceholder"></textarea>
          <button class="send-button" type="submit" title="发送" aria-label="发送" data-i18n-title="send" data-i18n-aria-label="send">
            <svg class="send-icon ui-icon" aria-hidden="true"><use href="#icon-send"></use></svg>
            <svg class="stop-icon ui-icon" aria-hidden="true"><use href="#icon-stop"></use></svg>
          </button>
        </form>
      </main>
